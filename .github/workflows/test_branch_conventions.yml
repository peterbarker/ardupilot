name: Test for Malformed Commits in PR Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'pr-claude/trailing-newline-demo'

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-merge-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          submodules: 'false'
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git remote add upstream ${{ github.event.pull_request.base.repo.clone_url || github.event.repository.clone_url }}
          git fetch upstream ${{ github.event.pull_request.base.ref || 'pr-claude/trailing-newline-base' }}

      - name: Check branch conventions
        shell: bash
        run: |
          Tools/scripts/check_branch_conventions.py --base-branch "upstream/${{ github.event.pull_request.base.ref || 'pr-claude/trailing-newline-base' }}"

name: test rover  # NB: the name is part of the ccache key; do not change it

# THIS BRANCH IS AN EXPERIMENT, NOT FOR MERGE.
#
# Every other workflow has been deleted so that a push runs only the
# Rover autotest suite.  That suite is then run at a range of
# --parallel values, three times each, so we can see how the wall-clock
# time and the failure count move as we ask a GitHub runner to run more
# tests at once.
#
# Third time around, and the first with a suite worth timing.  The
# previous two sweeps were dominated by failures: a leg which fails
# early also finishes early, so the times above --parallel=3 were
# measuring which tests died rather than how well the suite
# parallelises.  Since then the causes have been fixed - tests
# inheriting state from whichever test ran before them, budgets counted
# in simulated time around wall-clock work, and two SITL components
# which assumed they were the only one on the machine.
#
# So this run has two jobs: get a timing curve which is not contaminated
# by failures, and show whether those fixes hold up on a 4-core runner
# as well as they do on a 32-thread one.
#
# Previously:  The first sweep (levels up to 20, twice each)
# said the curve bottoms out by --parallel=3 and that every level from
# 4 up failed at least once - and the failures were the story, because
# a leg which fails early also finishes early, which made the times
# above 3 meaningless.  So: stop at 12, since nothing above it helped,
# and take three samples per level instead of two, because the spread
# between legs of one level turned out to be as large as the difference
# between levels.  The tests that failed the high-parallel legs last
# time (MAV_CMD_DO_SET_REVERSE, RCOverrideEnableChannel, AccelCal) are
# fixed on the branch this is cut from.
#
# Read the results with Tools/scripts/ci_parallel_sweep_report.py,
# which pulls the per-step timings straight out of the actions API.

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{github.ref}}-${{github.workflow}}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      actions: write  # save-ccache prunes the previous cache entry
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-base:v0.2.0
    steps:
      # git checkout the PR
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: base
      - name: build rover
        shell: bash
        # Need --enable-math-check-indexes to match build_ci.sh build phase
        run: |
          pppd --help # fail with `command not found` if ppp install failed
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board sitl --debug --enable-math-check-indexes
          ./waf build --target bin/ardurover
          ccache -s
          ccache -z
      # NB: no pre-build/save-ccache step here.  save-ccache only writes
      # on master pushes, so nothing this job builds can reach the sweep
      # legs; they all restore master's cache instead.  That is what a
      # real PR run gets, which is what we want to be measuring.

  autotest:
    needs: build  # don't try to launch the tests matrix if it doesn't build first, profit from caching for fast build
    runs-on: ubuntu-22.04
    # a serial run of the Rover suite is a long way north of the hour a
    # --parallel=8 run takes; do not let the default 6h cap it either
    timeout-minutes: 330
    container:
      image: ardupilot/ardupilot-dev-base:v0.2.0
      options: --privileged --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --security-opt seccomp=unconfined
    strategy:
      fail-fast: false  # don't cancel if a job from the matrix fails
      matrix:
        # the job name carries these two, and that is how the report
        # script tells the legs apart - do not reformat it
        parallel: [1, 2, 3, 4, 6, 8, 12]
        repeat: [1, 2, 3]

    name: autotest (parallel=${{matrix.parallel}} repeat=${{matrix.repeat}})

    steps:
      # git checkout the PR
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Register autotest fail matcher
        run: echo "::add-matcher::.github/problem-matchers/autotestfail.json"

      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: base

      # the runner we happen to land on decides how much parallelism
      # can possibly pay off, so put it in the log next to the timing
      - name: describe runner
        shell: bash
        run: |
          echo "nproc: $(nproc)"
          lscpu | grep -E "^(Model name|CPU\(s\)|Thread|Core)" || true
          free -m || true

      - name: test rover at --parallel=${{matrix.parallel}}
        env:
          CI_BUILD_TARGET: sitltest-rover
          AUTOTEST_PARALLEL: ${{matrix.parallel}}
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          Tools/scripts/build_ci.sh

      - name: Archive buildlog artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
           name: buildlogs-parallel-${{matrix.parallel}}-repeat-${{matrix.repeat}}
           path: |
             /tmp/buildlogs
             /__w/ardupilot/ardupilot/ap-*.core
             /__w/ardupilot/ardupilot/core.*
           retention-days: 14

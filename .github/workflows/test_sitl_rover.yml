name: test rover  # NB: the name is part of the ccache key; do not change it

# THIS BRANCH IS AN EXPERIMENT, NOT FOR MERGE.
#
# Trying to reproduce, and to tell apart the two explanations for, this:
#
#     RTL_SPEED (Test RTL_SPEED is honoured) (Failed to attain groundspeed
#     between 5.4 and 5.6, reached 0.028583424165844917)
#
# The vehicle is stationary where it should be doing 5.5m/s.  RTL_SPEED
# drives out on a mission and then does four RTL legs at different
# speeds; between them those legs spend about 160m of the 300m it has,
# and a vehicle which starts closer simply arrives home and stops.
#
# Two candidate explanations:
#
#   1. starvation.  The test's process does not get scheduled and
#      something is measured wrongly.  If this is it, loading the machine
#      should provoke it, and the test on its own on an idle machine
#      should not.
#
#   2. where the vehicle starts.  This has only been seen in --parallel
#      runs, which no longer reset the SITL between tests, so RTL_SPEED
#      begins wherever the previous test left the vehicle.  If this is
#      it, no amount of CPU load will provoke it on its own; it needs the
#      rest of the suite running before it.
#
# On a 32-core machine it failed twice at --parallel=6 with 26 cores
# spare, which points at 2 rather than 1 - but that is one observation.
#
# The branch this is cut from carries a precondition in RTL_SPEED which
# waits for the vehicle to be 250m from home before it starts spending
# that distance.  That makes the two cases say different things:
#
#   "Failed to attain Distance to home"  -> explanation 2
#   "Failed to attain groundspeed"       -> explanation 1
#
# Whichever it is, keep the logs.  Every previous occurrence has been
# overwritten by the following run before it could be read.

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{github.ref}}-${{github.workflow}}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-base:v0.2.0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: base
      - name: build rover
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board sitl --debug --enable-math-check-indexes
          ./waf build --target bin/ardurover
          ccache -s

  repro:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    container:
      image: ardupilot/ardupilot-dev-base:v0.2.0
      options: --privileged --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        # solo        - the test on its own, idle machine
        # solo-loaded - the test on its own with the cores kept busy
        # suite       - the whole Rover suite, which is where it has
        #               actually been seen to fail
        mode: [solo, solo-loaded, suite]
        shard: [1, 2, 3, 4]

    name: repro (${{matrix.mode}} ${{matrix.shard}})

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: base

      - name: describe runner
        shell: bash
        run: |
          echo "nproc: $(nproc)"
          free -m || true

      - name: build rover
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board sitl --debug --enable-math-check-indexes
          ./waf build --target bin/ardurover

      - name: hunt
        shell: bash
        env:
          MODE: ${{matrix.mode}}
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          KEEP=/tmp/rtlspeed-failures
          mkdir -p $KEEP

          case "$MODE" in
            solo)        iterations=15; loopers=0 ;;
            solo-loaded) iterations=15; loopers=8 ;;
            suite)       iterations=3;  loopers=0 ;;
          esac

          pids=""
          for i in $(seq 1 $loopers); do
            ( while :; do :; done ) &
            pids="$pids $!"
          done
          echo "started $loopers cpu loopers on $(nproc) cores"

          fails=0
          for n in $(seq 1 $iterations); do
            rm -f ../buildlogs/autotest.lck
            rm -rf scripts parallel-autotest
            if [ "$MODE" = "suite" ]; then
              cmd="./Tools/autotest/autotest.py --no-configure --parallel=6 test.Rover"
            else
              cmd="./Tools/autotest/autotest.py --no-configure test.Rover.RTL_SPEED"
            fi
            echo "=== iteration $n/$iterations: $cmd"
            if $cmd > /tmp/iter-$n.log 2>&1; then
              echo "    pass"
            else
              fails=$((fails+1))
              echo "    FAIL - keeping logs"
              d=$KEEP/iteration-$n
              mkdir -p $d
              cp /tmp/iter-$n.log $d/ || true
              # the per-test log is the one worth having, and the one the
              # next iteration would otherwise overwrite:
              cp ../buildlogs/Rover-*.txt $d/ 2>/dev/null || true
              cp -r logs $d/dataflash 2>/dev/null || true
              grep -aoE "Failed to attain [^)]*" /tmp/iter-$n.log | head -3 > $d/reason.txt || true
            fi
          done

          for p in $pids; do kill $p 2>/dev/null || true; done

          echo "############################################"
          echo "MODE=$MODE  failures=$fails of $iterations"
          for d in $KEEP/iteration-*; do
            [ -d "$d" ] || continue
            echo "--- $(basename $d): $(head -1 $d/reason.txt 2>/dev/null)"
          done
          echo "############################################"

      - name: Archive failures
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rtlspeed-${{matrix.mode}}-${{matrix.shard}}
          path: /tmp/rtlspeed-failures
          retention-days: 14
          if-no-files-found: ignore
